  <script>
    /* Apply saved accessibility settings before first paint (mirrors ThemeService). */
    (function () {
      var r = document.documentElement, t, m;
      try { t = localStorage.getItem('portfolio.theme'); m = localStorage.getItem('portfolio.motion'); } catch (e) {}
      r.dataset.theme = t || (matchMedia('(prefers-contrast: more)').matches ? 'contrast' : 'dark');
      r.dataset.motion = m || (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full');
    })();
  </script>
