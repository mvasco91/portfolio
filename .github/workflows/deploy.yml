name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A repo named <user>.github.io is served from "/"; any other repo from "/<repo>/".
      - name: Compute base href
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then echo "href=/" >> "$GITHUB_OUTPUT"; else echo "href=/$REPO/" >> "$GITHUB_OUTPUT"; fi

      - run: npx ng build --base-href "${{ steps.base.outputs.href }}"

      - name: SPA fallback
        run: cp dist/mauricio-portfolio/browser/index.html dist/mauricio-portfolio/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mauricio-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
